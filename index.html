<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- %VITE_APP_NAME% is replaced by Vite with the value from .env -->
    <title>%VITE_APP_NAME% · Car pooling</title>
    <!-- Runs BEFORE React loads, so dark-mode users never see a white flash.
         Must match ThemeProvider: same "theme" key and the same "dark" class. -->
    <script>
      try {
        var t = localStorage.getItem('theme')
        var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
